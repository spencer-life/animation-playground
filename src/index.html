<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="A hub for reusable web animation. Browse by project, preview light and dark palettes, and take complete, theme-aware examples into your next project.">
  <meta property="og:title" content="Animation Playground">
  <meta property="og:description" content="Everyday interactions, distinctive details, and colors that fit your project. Complete, copyable code.">
  <meta property="og:type" content="website">
  <title>Animation Playground — Motion worth borrowing</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    try {
      const saved = localStorage.getItem('ap-theme');
      document.documentElement.dataset.theme = ['light','dark'].includes(saved) ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the playground</a>
  <div id="app">
    <div class="initial-state"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><h1>Animation Playground</h1><p>Opening the collection…</p></div>
  </div>
  <div id="announcement" role="status" aria-live="polite" class="announcement"></div>
  <noscript><div class="no-script"><h1>Animation Playground</h1><p>Enable JavaScript to browse and control the interactive gallery. You can also <a href="./examples/">open the standalone examples</a> or <a href="./llms-full.txt">read the complete text reference</a>.</p></div></noscript>
</body>
</html>
